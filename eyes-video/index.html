<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Give Claude eyes — 9:16 silent explainer</title>
<style>
  @font-face{font-family:'Inter';src:url('fonts/Inter-300.ttf') format('truetype');font-weight:300;font-style:normal;font-display:block}
  @font-face{font-family:'Inter';src:url('fonts/Inter-400.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
  @font-face{font-family:'Inter';src:url('fonts/Inter-600.ttf') format('truetype');font-weight:600;font-style:normal;font-display:block}
  @font-face{font-family:'Inter';src:url('fonts/Inter-800.ttf') format('truetype');font-weight:800;font-style:normal;font-display:block}
  @font-face{font-family:'JBMono';src:url('fonts/JBMono-400.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
  @font-face{font-family:'JBMono';src:url('fonts/JBMono-500.ttf') format('truetype');font-weight:500;font-style:normal;font-display:block}
  @font-face{font-family:'JBMono';src:url('fonts/JBMono-700.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}

  :root{
    --paper:#EDE7DC;
    --paper-hi:#F6F2EA;
    --ink:#15171B;
    --ink-soft:#4A4F58;
    --accent:#1B3FD8;
    --muted:#8B8477;
    --rule:#CBC4B5;
    --rule-soft:#DBD5C8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000}
  body{width:1080px;height:1920px;overflow:hidden}

  #stage{
    position:relative;width:1080px;height:1920px;background:var(--paper);
    overflow:hidden;transform-origin:50% 46%;
    -webkit-font-smoothing:antialiased;
  }
  .abs{position:absolute}
  .mono{font-family:'JBMono',monospace}
  .sans{font-family:'Inter',sans-serif}

  /* ---------- ambient layers ---------- */
  #tint{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 78% at 50% 30%,var(--paper-hi) 0%,transparent 62%);
  }
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:multiply}
  #vign{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(126% 88% at 50% 42%,transparent 52%,rgba(21,23,27,.14) 100%);
  }

  /* ---------- top bar ---------- */
  #slabel{left:84px;top:104px;font-family:'JBMono',monospace;font-size:21px;font-weight:500;
          letter-spacing:.22em;color:var(--accent);white-space:nowrap}
  #meter{left:794px;top:112px;width:202px;height:4px}
  #meter i{position:absolute;top:0;width:22px;height:3px;background:var(--rule)}
  #meter i.on{background:var(--accent)}

  /* ---------- headline ---------- */
  #hero{left:84px;top:232px;width:930px;font-family:'Inter',sans-serif;font-weight:800;
        font-size:98px;line-height:108px;letter-spacing:-.032em;color:var(--ink)}
  #hero .ln{display:block;white-space:nowrap}
  #hero .ln:last-child{color:var(--accent)}
  #hero .w{display:inline-block;transform-origin:0% 76%}

  #term{left:84px;top:296px;width:930px;font-family:'JBMono',monospace;font-size:31px;
        font-weight:400;color:var(--ink-soft);white-space:nowrap}
  #term b{color:var(--accent);font-weight:500}
  #termtx{display:inline-block;white-space:nowrap}
  #caret{position:absolute;left:0;top:3px;width:13px;height:33px;background:var(--accent)}

  #sub{left:84px;top:474px;font-family:'Inter',sans-serif;font-weight:400;font-size:42px;
       letter-spacing:-.012em;color:var(--muted);white-space:nowrap}
  #strike{position:absolute;left:-6px;top:26px;height:4px;background:var(--accent);
          transform:scaleX(0);transform-origin:0% 50%}

  /* ---------- contact sheet ---------- */
  #sheet{position:absolute;left:85px;top:640px;transform-origin:50% 50%}

  /* ---------- transcript rail ---------- */
  #rail{left:85px;top:1478px;width:910px;font-family:'JBMono',monospace;font-size:23px;
        font-weight:400;line-height:36px;color:var(--ink-soft)}
  #rail div{white-space:nowrap;clip-path:inset(0 100% 0 0)}
  #rail span{color:var(--accent)}

  /* ---------- payoff ---------- */
  #count{left:0;top:236px;width:1080px;text-align:center;font-family:'Inter',sans-serif;
         font-weight:800;font-size:286px;line-height:286px;letter-spacing:-.05em;color:var(--ink);
         font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
         transform-origin:50% 50%;opacity:0}
  #cbar{left:280px;top:562px;height:4px;background:var(--accent);width:0}
  #clabel{left:0;top:588px;width:1080px;text-align:center;font-family:'JBMono',monospace;
          font-size:22px;font-weight:500;letter-spacing:.24em;color:var(--muted);opacity:0}

  #chip{left:340px;top:290px;width:400px;height:138px;border:1px solid var(--rule);
        background:rgba(246,242,234,.86);opacity:0;transform-origin:50% 50%}
  #chip .play{position:absolute;left:30px;top:54px;width:0;height:0;
              border-left:24px solid var(--accent);border-top:15px solid transparent;border-bottom:15px solid transparent}
  #ctime{position:absolute;left:90px;top:38px;font-family:'JBMono',monospace;font-size:52px;
         font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
  #clen{position:absolute;left:92px;top:96px;font-family:'JBMono',monospace;font-size:15px;
        font-weight:400;letter-spacing:.16em;color:var(--muted);white-space:nowrap}

  /* ---------- caption band ---------- */
  #capbar{left:518px;top:1596px;width:44px;height:3px;background:var(--accent);
          transform:scaleX(0);transform-origin:50% 50%}
  #cap{left:84px;top:1624px;width:912px;text-align:center;font-family:'Inter',sans-serif;
       font-weight:600;font-size:41px;line-height:52px;letter-spacing:-.014em;color:var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <div id="tint"></div>

  <canvas id="sheet" width="910" height="810"></canvas>

  <div id="slabel" class="abs"></div>
  <div id="meter" class="abs"></div>

  <div id="hero" class="abs"></div>
  <div id="term" class="abs"><span id="termtx"></span><i id="caret"></i></div>
  <div id="sub" class="abs"><span id="subtx"></span><i id="strike"></i></div>

  <div id="rail" class="abs"></div>

  <div id="chip" class="abs"><i class="play"></i><div id="ctime">00:00</div><div id="clen">SOURCE DURATION 30:00</div></div>

  <div id="count" class="abs">0</div>
  <div id="cbar" class="abs"></div>
  <div id="clabel" class="abs">FRAMES SEEN · ONE PASS</div>

  <div id="capbar" class="abs"></div>
  <div id="cap" class="abs"></div>

  <canvas id="grain" width="1080" height="1920"></canvas>
  <div id="vign"></div>
</div>

<script>
/* ============================================================
   Give Claude eyes — 1080x1920, silent, 24s.
   The page never animates on its own: it exposes renderFrame(t)
   so the renderer can drive it one frame at a time.
   ============================================================ */
const W = 1080, H = 1920;
const DURATION = 24.0;
window.VIDEO_DURATION = DURATION;

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, k) => a + (b - a) * k;
const win   = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const outCubic = k => 1 - Math.pow(1 - k, 3);
const outQuint = k => 1 - Math.pow(1 - k, 5);
const outBack  = k => { const c = 1.68; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const inOut    = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
/* deterministic per-index noise — never Math.random(), the render must repeat exactly */
const hash = i => { let x = Math.sin(i * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); };
/* a segment that runs to the end of the piece holds instead of fading out */
const exit = (t, seg, d) => seg.b >= DURATION - 1e-6 ? 0 : win(t, seg.b - d, seg.b);

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, k) => {
  const A = hex(a), B = hex(b);
  return `rgb(${Math.round(lerp(A[0], B[0], k))},${Math.round(lerp(A[1], B[1], k))},${Math.round(lerp(A[2], B[2], k))})`;
};

const PAPER = '#EDE7DC', INK = '#15171B', ACCENT = '#1B3FD8', RULE = '#CBC4B5', MUTED = '#8B8477';

/* ---------- the script ----------
   Each beat carries the headline, the caption that replaces the removed
   voiceover, the mono command line, and the chapter label. */
const BEATS = [
  { t:  0.00, stage:'01 · THE GAP',     hero:['Claude reads','the transcript.'], cap:'Claude reads the transcript.' },
  { t:  1.75, stage:'01 · THE GAP',     hero:['Claude reads','the transcript.'], cap:'It never sees the picture.',
              sub:'It never sees the picture.' },
  { t:  3.40, stage:'01 · THE GAP',     hero:['Half the video','is missing.'],   cap:'So half of every video is missing.' },
  { t:  4.95, stage:'02 · THE FIX',     hero:['So give it','eyes.'],             cap:'So give it eyes.' },
  { t:  6.45, stage:'02 · THE FIX',     hero:['One skill.','Every frame.'],      cap:'One skill that shows Claude every frame.' },
  { t:  8.70, stage:'03 · YT-DLP',      term:'$ yt-dlp -f mp4 -o video.mp4 <url>',
              cap:'yt-dlp pulls the file down.' },
  { t: 10.65, stage:'04 · FFMPEG',      term:'$ ffmpeg -i video.mp4 -vf <b>fps=15,tile=5x9</b>',
              cap:'FFmpeg cuts it into frames.' },
  { t: 12.85, stage:'05 · WHISPER.CPP', term:'$ whisper-cli -m ggml-base.en.bin -f audio.wav',
              cap:'whisper.cpp writes the words, locally.' },
  { t: 14.85, stage:'06 · CLAUDE',      term:'# <b>225</b> hook frames + <b>514</b> body frames + words',
              cap:'Claude reads both, timestamps aligned.' },
  { t: 16.65, stage:'07 · THE RESULT',  cap:'A thirty-minute video.' },
  { t: 17.85, stage:'07 · THE RESULT',  cap:'739 frames in a single pass.' },
  { t: 20.45, stage:'07 · THE RESULT',  hero:['All local.','Zero API cost.'],    cap:'All local. Zero API cost.' },
  { t: 22.10, stage:'07 · THE RESULT',  hero:['It sees the','whole video.'],     cap:'It sees the whole video.' }
];
const STAGES = [...new Set(BEATS.map(b => b.stage))];

/* sheet choreography — independent of the beat list so the two can be tuned apart */
const S = {
  words:   0.45,   // faux transcript lines draw in
  clear:   3.45,   // the words wipe out — nothing was ever seen
  cells:   4.10,   // empty frame cells outline in where they should have been
  look:    5.05,   // a cobalt outline travels the empty cells
  power:   6.50,   // the empty cells darken in sequence, one after another
  card:    8.80,   // the source video lands as one card
  burst:  10.70,   // the card splits into its 24 frames
  tsplit:  0.058,  // per-cell stagger of that split
  rail:   12.95,   // transcript lines return, under the sheet
  scan:   14.95,   // cobalt scan bar + per-frame timestamps
  count:  17.95,   // the counter races above the finished sheet
  lock:   19.90,   // counter locks on 739
  back:   20.15    // counter clears out before the closing headline lands
};

const COLS = 4, ROWS = 6, GAP = 18, CW = 214, CH = 120, NCELL = COLS * ROWS;
const cellRect = k => ({
  x: (k % COLS) * (CW + GAP),
  y: Math.floor(k / COLS) * (CH + GAP),
  w: CW, h: CH
});
const CARD = { w: 520, h: 292, x: (910 - 520) / 2, y: (810 - 292) / 2 };
/* the slice of the source card that becomes cell k */
const cardSlice = k => ({
  x: CARD.x + (k % COLS) * (CARD.w / COLS),
  y: CARD.y + Math.floor(k / COLS) * (CARD.h / ROWS),
  w: CARD.w / COLS, h: CARD.h / ROWS
});

/* ---------- segments: text that persists across several beats ---------- */
const segs = (key) => {
  const out = [];
  BEATS.forEach((b, i) => {
    const end = i + 1 < BEATS.length ? BEATS[i + 1].t : DURATION;
    const v = b[key];
    const last = out[out.length - 1];
    if (v && last && last.v === v && Math.abs(last.b - b.t) < 1e-6) last.b = end;
    else if (v) out.push({ a: b.t, b: end, v });
  });
  return out;
};
let HERO, TERM, CAP, SUB;

const el = {};
['stage','slabel','meter','hero','term','termtx','caret','sub','subtx','strike','rail','chip','ctime',
 'count','cbar','clabel','capbar','cap','sheet','grain'].forEach(id => el[id] = document.getElementById(id));

let g, lastHero = '', lastCap = '', lastTerm = '';

/* ============================================================
   prepare() — one-time setup: fonts, grain, static DOM
   ============================================================ */
window.prepare = async function () {
  HERO = segs('hero').map(s => ({ ...s, v: s.v.join('\n') }));
  TERM = segs('term');
  CAP  = segs('cap');
  SUB  = segs('sub');

  el.meter.innerHTML = STAGES.map((_, i) => `<i style="left:${i * 30}px"></i>`).join('');
  el.rail.innerHTML = [
    '00:00  claude reads the transcript,',
    '00:07  <span>and now looks at every frame</span>',
    '00:14  while the words scroll past.'
  ].map(l => `<div>${l}</div>`).join('');

  g = el.sheet.getContext('2d');

  /* paper grain, drawn once from a fixed seed */
  const gc = el.grain.getContext('2d');
  const img = gc.createImageData(W, H);
  let seed = 20260730;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 150 + rnd() * 105;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  gc.putImageData(img, 0, 0);

  await document.fonts.ready;
  renderFrame(0);
};

/* ============================================================
   one synthetic "clip" — every sheet cell is this same scene
   sampled at a different moment, which is the whole point of
   the skill: same video, many frames.
   ============================================================ */
function miniScene(x, y, w, h, u) {
  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();

  const sky = g.createLinearGradient(0, y, 0, y + h);
  sky.addColorStop(0, mix('#46577A', '#171C27', u));
  sky.addColorStop(1, mix('#141821', '#06080C', u));
  g.fillStyle = sky; g.fillRect(x, y, w, h);

  /* a disc rises and sets across the clip */
  const cx = x + (0.16 + 0.68 * u) * w;
  const cy = y + h * (0.66 - 0.44 * Math.sin(Math.PI * u));
  const r  = h * 0.13;
  const glow = g.createRadialGradient(cx, cy, 0, cx, cy, r * 4.6);
  glow.addColorStop(0, 'rgba(120,150,235,.55)');
  glow.addColorStop(1, 'rgba(120,150,235,0)');
  g.fillStyle = glow; g.fillRect(x, y, w, h);
  g.fillStyle = mix('#DCE4F6', '#8CA0E8', u);
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();

  /* horizon + silhouettes, deterministic per column */
  const hy = y + h * 0.70;
  g.fillStyle = 'rgba(160,180,225,.20)'; g.fillRect(x, hy, w, 1);
  g.fillStyle = mix('#0B0E14', '#04060A', u);
  for (let i = 0; i < 7; i++) {
    const bw = w / 7;
    const bh = h * (0.10 + 0.20 * hash(i * 3.7 + Math.floor(u * 23) * 0.11));
    g.fillRect(x + i * bw, hy - bh, bw + 1, h - (hy - y - bh));
  }
  g.fillStyle = 'rgba(255,255,255,.05)'; g.fillRect(x, hy, w, h - (hy - y));

  g.restore();
}

/* faux transcript block: the words Claude already had, stamped like a transcript */
function drawWords(t, alpha) {
  if (alpha <= 0.002) return;
  g.save();
  g.font = '400 15px JBMono, monospace';
  for (let i = 0; i < 18; i++) {
    const p = outCubic(win(t, S.words + i * 0.105, S.words + i * 0.105 + 0.5));
    if (p <= 0) continue;
    const y = 34 + i * 42;
    const secs = i * 75;
    g.globalAlpha = alpha * p * 0.42;
    g.fillStyle = INK;
    g.fillText(`${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`, 0, y + 11);
    const short = (i + 1) % 6 === 0;
    const wmax = (short ? 0.34 : 0.66 + 0.24 * hash(i * 2.3)) * 910;
    g.globalAlpha = alpha * p * 0.5;
    g.fillRect(76, y, wmax * p, 10);
  }
  g.restore();
}

function cellOutline(x, y, w, h, alpha, color, lw) {
  g.save();
  g.globalAlpha = alpha;
  g.strokeStyle = color; g.lineWidth = lw || 1;
  g.strokeRect(x + .5, y + .5, w - 1, h - 1);
  g.restore();
}

function drawSheet(t) {
  g.clearRect(0, 0, 910, 810);

  g.save();

  /* act 1 — the words, and then the empty frames where the pictures should
     have been. The words clear out first so the two never fight for the space. */
  drawWords(t, 1 - win(t, S.clear, S.clear + 0.55));

  const outlineIn = win(t, S.cells, S.cells + 0.9);
  const burstDone = k => win(t, S.burst + k * S.tsplit, S.burst + k * S.tsplit + 0.62);

  for (let k = 0; k < NCELL; k++) {
    const c = cellRect(k);
    const p = outQuint(burstDone(k));
    if (p <= 0) {
      /* still empty: an outline waiting to be filled. Each one darkens in turn
         so the grid keeps moving through the two beats before the download. */
      const on = outCubic(win(t, S.power + k * 0.07, S.power + k * 0.07 + 0.45));
      const a = outlineIn * (0.26 + 0.22 * outCubic(win(t, S.look, S.look + 1.2)) + 0.34 * on);
      cellOutline(c.x, c.y, c.w, c.h, a * (1 - 0.5 * win(t, S.card, S.card + 0.5)), INK);
      continue;
    }
    const s = cardSlice(k);
    const x = lerp(s.x, c.x, p), y = lerp(s.y, c.y, p);
    const w = lerp(s.w, c.w, p), h = lerp(s.h, c.h, p);
    miniScene(x, y, w, h, k / (NCELL - 1));
    cellOutline(x, y, w, h, 0.22 * p, INK);
  }

  /* the travelling cobalt outline — "give it eyes" — with one cell of trail */
  if (t > S.look && t < S.card) {
    const fade = 1 - win(t, S.card - 0.6, S.card);
    const head = Math.floor((t - S.look) * 7.5);
    for (let back = 2; back >= 0; back--) {
      const c = cellRect(((head - back) % NCELL + NCELL) % NCELL);
      if (back === 0) {
        g.save();
        g.globalAlpha = 0.07 * fade;
        g.fillStyle = ACCENT; g.fillRect(c.x, c.y, c.w, c.h);
        g.restore();
      }
      cellOutline(c.x, c.y, c.w, c.h, (back === 0 ? 0.9 : back === 1 ? 0.4 : 0.16) * fade, ACCENT, 2);
    }
  }

  /* the source video, before it is cut up */
  const cardIn = outQuint(win(t, S.card, S.card + 0.75));
  const cardOut = win(t, S.burst, S.burst + 0.22);
  if (cardIn > 0 && cardOut < 1) {
    g.save();
    g.globalAlpha = cardIn * (1 - cardOut);
    const sc = lerp(0.94, 1, outBack(cardIn));
    g.translate(CARD.x + CARD.w / 2, CARD.y + CARD.h / 2);
    g.scale(sc, sc);
    g.translate(-(CARD.x + CARD.w / 2), -(CARD.y + CARD.h / 2));
    miniScene(CARD.x, CARD.y, CARD.w, CARD.h, 0.5);
    cellOutline(CARD.x, CARD.y, CARD.w, CARD.h, 0.30, INK);
    /* play glyph */
    g.fillStyle = 'rgba(237,231,220,.92)';
    g.beginPath();
    const px = CARD.x + CARD.w / 2 - 14, py = CARD.y + CARD.h / 2;
    g.moveTo(px, py - 24); g.lineTo(px + 40, py); g.lineTo(px, py + 24); g.closePath(); g.fill();
    g.restore();
  }

  /* the scan pass: a cobalt bar walks down and stamps each frame's timestamp */
  const scanP = win(t, S.scan, S.scan + 1.25);
  if (scanP > 0) {
    for (let k = 0; k < NCELL; k++) {
      const c = cellRect(k);
      const rowP = clamp((scanP * 810 - c.y) / 90);
      if (rowP <= 0) continue;
      /* the 24 cells stand in for the whole 30-minute source, so the stamps
         walk the full half hour rather than the first 80 seconds */
      const secs = k * 75;
      const label = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
      g.save();
      g.globalAlpha = rowP;
      g.fillStyle = ACCENT;
      g.fillRect(c.x, c.y + c.h - 22, 62, 18);
      g.fillStyle = '#EDE7DC';
      g.font = '500 13px JBMono, monospace';
      g.fillText(label, c.x + 7, c.y + c.h - 9);
      g.restore();
    }
    if (scanP < 1) {
      const sy = scanP * 810;
      const grad = g.createLinearGradient(0, sy - 26, 0, sy + 4);
      grad.addColorStop(0, 'rgba(27,63,216,0)');
      grad.addColorStop(1, 'rgba(27,63,216,.30)');
      g.fillStyle = grad; g.fillRect(0, sy - 26, 910, 30);
      g.fillStyle = ACCENT; g.fillRect(0, sy, 910, 2);
    }
  }
  g.restore();
}

/* ============================================================
   renderFrame(t)
   ============================================================ */
window.renderFrame = function (t) {
  t = clamp(t, 0, DURATION);

  /* a very slow push-in so no frame is completely static */
  el.stage.style.transform = `scale(${lerp(1, 1.028, t / DURATION).toFixed(5)})`;

  const bi = Math.max(0, BEATS.findLastIndex(b => t >= b.t - 1e-6));
  const beat = BEATS[bi];

  /* chapter label + stage meter */
  el.slabel.textContent = beat.stage;
  const si = STAGES.indexOf(beat.stage);
  [...el.meter.children].forEach((n, i) => n.className = i <= si ? 'on' : '');
  el.slabel.style.opacity = outCubic(win(t, beat.t, beat.t + 0.4));

  /* ---- headline ---- */
  const hs = HERO.find(s => t >= s.a - 1e-6 && t < s.b);
  if (hs) {
    if (lastHero !== hs.v) {
      lastHero = hs.v;
      el.hero.innerHTML = hs.v.split('\n')
        .map(l => `<span class="ln">${l.split(' ').map(w => `<span class="w">${w}</span>`).join(' ')}</span>`)
        .join('');
    }
    const words = el.hero.querySelectorAll('.w');
    const out = exit(t, hs, 0.3);
    words.forEach((w, i) => {
      const p = outQuint(win(t, hs.a + i * 0.06, hs.a + i * 0.06 + 0.66));
      w.style.opacity = (p * (1 - out)).toFixed(4);
      w.style.filter = `blur(${((1 - p) * 8).toFixed(2)}px)`;
      w.style.transform = `translateY(${((1 - p) * 40 - out * 24).toFixed(2)}px) scale(${lerp(1.05, 1, outBack(p)).toFixed(4)})`;
    });
    el.hero.style.opacity = 1;
  } else {
    el.hero.style.opacity = 0;
    lastHero = '';
  }

  /* ---- mono command line (stands in for the headline during the pipeline) ---- */
  const ts = TERM.find(s => t >= s.a - 1e-6 && t < s.b);
  if (ts) {
    if (lastTerm !== ts.v) { lastTerm = ts.v; el.termtx.innerHTML = ts.v; }
    /* the clip runs on the text span, not the box, so the reveal lands exactly
       on the last glyph and the caret can ride the edge of it */
    const p = win(t, ts.a + 0.1, ts.a + 0.8);
    el.term.style.opacity = (outCubic(win(t, ts.a, ts.a + 0.3)) * (1 - win(t, ts.b - 0.25, ts.b))).toFixed(4);
    el.termtx.style.clipPath = `inset(0 ${(100 - 100 * p).toFixed(2)}% 0 0)`;
    el.caret.style.left = (p * el.termtx.offsetWidth).toFixed(1) + 'px';
    el.caret.style.opacity = p < 1 ? 1 : 0;
  } else {
    el.term.style.opacity = 0;
    lastTerm = '';
  }

  /* ---- struck-through sub-line ---- */
  const ss = SUB.find(s => t >= s.a - 1e-6 && t < s.b);
  if (ss) {
    el.subtx.textContent = ss.v;
    const p = outQuint(win(t, ss.a, ss.a + 0.5));
    el.sub.style.opacity = (p * (1 - win(t, ss.b - 0.28, ss.b))).toFixed(4);
    el.sub.style.transform = `translateY(${((1 - p) * 20).toFixed(2)}px)`;
    el.strike.style.width = (el.subtx.offsetWidth + 12) + 'px';
    el.strike.style.transform = `scaleX(${outQuint(win(t, ss.a + 0.95, ss.a + 1.45)).toFixed(4)})`;
  } else {
    el.sub.style.opacity = 0;
  }

  /* ---- contact sheet ---- */
  drawSheet(t);
  el.sheet.style.transform = `scale(${lerp(1, 1.012, inOut(t / DURATION)).toFixed(5)})`;

  /* ---- transcript rail ---- */
  [...el.rail.children].forEach((n, i) => {
    const a = S.rail + i * 0.26;
    const p = outQuint(win(t, a, a + 0.75));
    n.style.clipPath = `inset(0 ${(100 - 100 * p).toFixed(2)}% 0 0)`;
  });
  el.rail.style.opacity = outCubic(win(t, S.rail, S.rail + 0.3)).toFixed(4);

  /* ---- the 30-minute source chip ---- */
  const chipIn = win(t, 16.75, 17.35), chipOut = win(t, 17.85, 18.15);
  el.chip.style.opacity = (outCubic(chipIn) * (1 - chipOut)).toFixed(4);
  el.chip.style.transform = `scale(${lerp(0.93, 1, outBack(outCubic(chipIn))).toFixed(4)}) translateY(${(-16 * chipOut).toFixed(2)}px)`;
  const secs = Math.round(1800 * outQuint(win(t, 16.85, 17.9)));
  el.ctime.textContent = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;

  /* ---- the counter ---- */
  const cp = outQuint(win(t, S.count, S.lock));
  const cIn = outCubic(win(t, S.count, S.count + 0.3));
  const cOut = win(t, S.back, S.back + 0.28);   // gone by the time the hero returns at 20.45
  const pop = 1 + 0.035 * Math.sin(Math.PI * clamp((t - S.lock) / 0.34)) ;
  el.count.textContent = Math.round(739 * cp).toLocaleString('en-US');
  el.count.style.opacity = (cIn * (1 - cOut)).toFixed(4);
  el.count.style.transform = `scale(${(lerp(0.96, 1, cIn) * pop).toFixed(4)})`;
  el.cbar.style.width = (520 * cp).toFixed(1) + 'px';
  el.cbar.style.opacity = (cIn * (1 - cOut)).toFixed(4);
  el.clabel.style.opacity = (outCubic(win(t, S.lock - 0.1, S.lock + 0.45)) * (1 - cOut)).toFixed(4);

  /* ---- caption band ---- */
  const cs = CAP.find(s => t >= s.a - 1e-6 && t < s.b) || CAP[CAP.length - 1];
  if (lastCap !== cs.v) { lastCap = cs.v; el.cap.textContent = cs.v; }
  const p = outQuint(win(t, cs.a, cs.a + 0.5));
  const o = exit(t, cs, 0.22);
  el.cap.style.opacity = (p * (1 - o)).toFixed(4);
  el.cap.style.transform = `translateY(${((1 - p) * 22 - o * 10).toFixed(2)}px)`;
  el.capbar.style.transform = `scaleX(${(p * (1 - o)).toFixed(4)})`;
};
</script>
</body>
</html>
